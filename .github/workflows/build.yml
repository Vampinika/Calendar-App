name: Build Real Madrid APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Android App via Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html

          # Initialize npm project and install capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Initialize capacitor app configuration
          npx cap init "Real Madrid Sync" "com.soccer.calendar" --web-dir www

          # Add official Android native platform wrapper
          npx cap add android

          # Sync the web files into the Android assets
          npx cap sync android

          # Grant execution permission to Gradle wrapper generated by Capacitor
          cd android
          chmod +x gradlew

          # Build the APK
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealMadridSync-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
