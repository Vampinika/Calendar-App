name: Build Cordova APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova & Build APK
        run: |
          # Install Cordova globally
          npm install -g cordova

          # Create a temporary Cordova project structure
          cordova create myApp com.soccer.calendar "Real Madrid Sync"
          cd myApp

          # Add Android platform target
          cordova platform add android

          # Replace default www page with our custom index.html
          cp ../index.html www/index.html

          # Build the debug APK
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealMadridSync-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

